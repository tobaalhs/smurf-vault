[package]
name = "smurf-vault"
version = "0.8.0"
description = "Bóveda cifrada para tus cuentas de Riot, sincronizada con Google Drive"
authors = ["tobaalhs"]
license = "MIT"
edition = "2021"

[lib]
name = "smurf_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Bóveda: el mismo formato que la versión Electron (scrypt + AES-256-GCM).
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# scrypt con N=2^17 tarda muchísimo sin optimizar: las dependencias se compilan optimizadas también en dev.
[profile.dev.package."*"]
opt-level = 3
