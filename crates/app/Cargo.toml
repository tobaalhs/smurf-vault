[package]
name = "smurf-vault"
description = "Bóveda cifrada para tus cuentas de Riot, sincronizada con Google Drive"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "smurf-vault"
path = "src/main.rs"

[dependencies]
sv-core = { path = "../core" }
gpui-kit = "0.11"
anyhow.workspace = true
serde_json.workspace = true
rust-embed = "8"
futures = "0.3"
ureq = "2"
# Desenfoque de los splash de fondo (GPUI no tiene filtro de blur para imágenes). Misma versión que
# ya trae GPUI.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Solo reproducción (los sonidos se sintetizan): sin decodificadores de archivos.
rodio = { version = "0.19", default-features = false }
# Bandeja del sistema (ícono con menú: abrir, bloquear, salir).
tray-icon = "0.21"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Avisos de Windows (partida aceptada, sigue en la bandeja).
tauri-winrt-notification = "0.7"
# Ocultar y mostrar la ventana, una sola instancia y abrir al iniciar Windows.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
